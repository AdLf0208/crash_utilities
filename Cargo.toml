[package]
# Port of Crash Utilities 9.0.4 (Darkere/CrashUtilities, commit
# 8ac8a96341dc06285af501ee83cc7f254a00dbfc, MIT). Minecraft Java 1.21.1
# NeoForge; the port targets Horizon 26.3 at the pin in horizon-mod.toml.
# Clean-room Rust rewrite from the mod's observable behaviour (notes.md);
# local-only until publishing is approved, publishable under MIT with this
# source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "crashutilities"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Crash Utilities for Horizon: the server admin commands (/cu e remove, /cu callItemClear, /cu tp, /cu unstuck)"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo
# horizon-mod` command (the launcher builds against its own copy of the same
# build). Any other registry dependency must be pinned with
# `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
